# Human-owned settings. Only Sebastian edits this file.

# R11 / AGENTS.md rule 8: after-attempt (default) | closed (no access until P25) | open
REFERENCE_POLICY: after-attempt

# sequential: a phase opens only when every lower-numbered phase has passed
#   (safe: P05 extends P03's script, P07 updates P03's consumer, P24 needs all).
# dependency: a phase opens when its depends_on have passed (allows P17/P18/P19 in parallel).
SCHEDULING: sequential

# required: STOP after 02_plan.md until "Approved by Sebastian: [x]" | auto
PLAN_APPROVAL: required

# human: Sebastian merges passed phases into main | orchestrator: the main session merges --no-ff and tags pxx-done
MERGE_POLICY: human

# Runner limits. Longer runs become human-run requests (local terminal or Colab).
LOCAL_RUN_BUDGET_MIN: 30
MAX_GPU_HOURS_PER_PHASE: 0     # 0 = no GPU jobs by agents; use the Colab path (P21)
DEVICE: auto                   # auto | cpu | cuda

# Raw data delivered for this rebuild (data/raw/<S>/*.ebr, git-ignored).
SUBJECTS: [S01, S02, S03, S04, S05]

# Seeds (AGENTS.md section 6)
SEED: 42
