# Team-specific phase data. mas/phases.yaml is part of the specification and is
# not edited; this file adds what this team needs on top of it
# (see team_mapping.md and decisions.md, 2026-10-24).

# Role (as written in phases.yaml owners) -> agent.
roles:
  Orchestrator: orchestrator
  Data Engineer: data-engineer
  Infra: data-engineer
  Signal Processing: signal-processing
  Online / Real-time: signal-processing
  Classical ML: classical-ml
  XAI: classical-ml
  Deep Learning: deep-learning
  Connectivity & Stats: connectivity-stats
  Evaluation Lead: evaluation-lead
  Scribe: scribe
  Verifier: verifier
  Scientific Reviewer: scientific-reviewer

# Every phase also gets these, whatever its owners say (mas/README.md §2).
always: [orchestrator, synthetic-tester, runner, verifier, scientific-reviewer, scribe]

# Agents that never receive a 03_changes file (checkers and the gatekeeper).
checkers: [orchestrator, synthetic-tester, runner, verifier, scientific-reviewer]

