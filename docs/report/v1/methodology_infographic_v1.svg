<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <title>Methodology pipeline v1 (historical, P06)</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- explicit background so the figure reads the same in light and dark viewers -->
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="30" y="48" font-size="24" font-weight="bold" fill="#111111">Methodology pipeline, v1 (P06)</text>
  <text x="30" y="76" font-size="14" fill="#333333">Legacy protocol as it was in the original project. Not the corrected pipeline.</text>
  <rect x="930" y="22" width="240" height="32" rx="4" fill="#9b2226"/>
  <text x="1050" y="44" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">v1 — historical</text>

  <!-- row 1: left to right -->
  <rect x="30" y="110" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="44" y="138" font-size="16" font-weight="bold" fill="#111111">1  OO recording</text>
  <text x="44" y="162" font-size="13" fill="#111111">256 Hz, 7 channels</text>
  <text x="44" y="180" font-size="13" fill="#111111">stimulus codes 101–105</text>
  <text x="44" y="198" font-size="13" fill="#111111">PO7 excluded (legacy)</text>

  <rect x="330" y="110" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="344" y="138" font-size="16" font-weight="bold" fill="#111111">2  Continuous filter</text>
  <text x="344" y="162" font-size="13" fill="#111111">Butterworth band-pass</text>
  <text x="344" y="180" font-size="13" fill="#111111">1–60 Hz, order 4, zero-phase</text>
  <text x="344" y="198" font-size="13" fill="#111111">before windowing</text>

  <rect x="630" y="110" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="644" y="138" font-size="16" font-weight="bold" fill="#111111">3  1.0 s windows</text>
  <text x="644" y="162" font-size="13" fill="#111111">256 samples, 5 per trial</text>
  <text x="644" y="180" font-size="13" fill="#111111">P02 raw gate:</text>
  <text x="644" y="198" font-size="13" fill="#111111">vpp ≤ 200 µV, std 0.5–60 µV</text>

  <rect x="930" y="110" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="944" y="138" font-size="16" font-weight="bold" fill="#111111">4  Quality mask</text>
  <text x="944" y="162" font-size="13" fill="#111111">vpp 0.5–120 µV</text>
  <text x="944" y="180" font-size="13" fill="#111111">std 0.1–35 µV</text>
  <text x="944" y="198" font-size="13" fill="#111111">one mask for all blocks</text>

  <line x1="270" y1="185" x2="322" y2="185" stroke="#333333" stroke-width="2"/>
  <polygon points="328,185 317,179 317,191" fill="#333333"/>
  <line x1="570" y1="185" x2="622" y2="185" stroke="#333333" stroke-width="2"/>
  <polygon points="628,185 617,179 617,191" fill="#333333"/>
  <line x1="870" y1="185" x2="922" y2="185" stroke="#333333" stroke-width="2"/>
  <polygon points="928,185 917,179 917,191" fill="#333333"/>

  <!-- connector from row 1 to row 2 -->
  <line x1="1050" y1="260" x2="1050" y2="322" stroke="#333333" stroke-width="2"/>
  <polygon points="1050,328 1044,317 1056,317" fill="#333333"/>

  <!-- row 2: right to left -->
  <rect x="930" y="330" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="944" y="358" font-size="16" font-weight="bold" fill="#111111">5  FBCSP + FBCCA</text>
  <text x="944" y="382" font-size="13" fill="#111111">FBCSP: 5 bands, m = 1 → 50</text>
  <text x="944" y="400" font-size="13" fill="#111111">per-window filter (legacy)</text>
  <text x="944" y="418" font-size="13" fill="#111111">FBCCA: 7 channels → 5</text>
  <text x="944" y="436" font-size="13" fill="#111111">total 55 columns</text>

  <rect x="630" y="330" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="644" y="358" font-size="16" font-weight="bold" fill="#111111">6  Scaler</text>
  <text x="644" y="382" font-size="13" fill="#111111">StandardScaler</text>
  <text x="644" y="400" font-size="13" fill="#111111">fitted per fold on the</text>
  <text x="644" y="418" font-size="13" fill="#111111">training rows only (R2)</text>

  <rect x="330" y="330" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="344" y="358" font-size="16" font-weight="bold" fill="#111111">7  Shrinkage-LDA</text>
  <text x="344" y="382" font-size="13" fill="#111111">LDA, solver lsqr</text>
  <text x="344" y="400" font-size="13" fill="#111111">shrinkage auto (Ledoit–Wolf)</text>
  <text x="344" y="418" font-size="13" fill="#111111">CV: StratifiedKFold(5,</text>
  <text x="344" y="436" font-size="13" fill="#111111">shuffle, 42) over windows</text>

  <rect x="30" y="330" width="240" height="150" rx="6" fill="#eef3f8" stroke="#2b5c8a" stroke-width="2"/>
  <text x="44" y="358" font-size="16" font-weight="bold" fill="#111111">8  i % 5 smoothing</text>
  <text x="44" y="382" font-size="13" fill="#111111">2.0 s column, legacy</text>
  <text x="44" y="400" font-size="13" fill="#111111">reset at i % 5 == 0 of the</text>
  <text x="44" y="418" font-size="13" fill="#111111">clean array (PF-02)</text>

  <line x1="922" y1="405" x2="878" y2="405" stroke="#333333" stroke-width="2"/>
  <polygon points="872,405 883,399 883,411" fill="#333333"/>
  <line x1="622" y1="405" x2="578" y2="405" stroke="#333333" stroke-width="2"/>
  <polygon points="572,405 583,399 583,411" fill="#333333"/>
  <line x1="322" y1="405" x2="278" y2="405" stroke="#333333" stroke-width="2"/>
  <polygon points="272,405 283,399 283,411" fill="#333333"/>

  <!-- warning band -->
  <rect x="30" y="524" width="1140" height="78" rx="6" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/>
  <text x="44" y="550" font-size="14" font-weight="bold" fill="#111111">Legacy, window-level cross-validation (R1, PF-01): windows of one trial can sit in both the training and the test fold.</text>
  <text x="44" y="574" font-size="14" fill="#111111">Also legacy: fs 250 Hz assumed on 256 Hz recordings (PF-04), per-window sub-band filtering (R3, PF-14). Corrected in P11 and later.</text>

  <text x="30" y="636" font-size="12" fill="#333333">Sources (paths in the repository): mas/01_DATA_SPEC.md §1, §3, §5.1; configs/pipeline_config.yaml (preprocessing block);</text>
  <text x="30" y="654" font-size="12" fill="#333333">scripts/preprocessing/run_preprocessing.py; src/features/ssvep/window_mask.py; reports/feature_selection_ablation_S03.meta.txt.</text>
  <text x="30" y="690" font-size="12" fill="#333333">Figure of report v1. Historical: this is the P06 pipeline, not the corrected pipeline.</text>
</svg>
